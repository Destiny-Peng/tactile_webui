name: Apply WebUI review overhaul

on:
  push:
    branches: [feat/webui-review-monitoring]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webui-review-monitoring
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply server integration
        run: python tools/apply_webui_monitor_patch.py
      - name: Python syntax
        run: python -m compileall -q webui tools/sharpa_tactile
      - name: Shell syntax
        run: bash -n tools/migrate_from_lf3r.sh
      - name: JavaScript syntax
        run: |
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
      - name: DOM contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('webui/static/index.html').read_text()
          js=Path('webui/static/shell.js').read_text()
          ids=set(re.findall(r'\bid="([^"]+)"',html))
          refs=set(re.findall(r'byId\("([^"]+)"\)',js))
          missing=sorted(refs-ids)
          if missing: raise SystemExit('missing DOM ids: '+', '.join(missing))
          print('DOM contract OK:',len(refs),'referenced ids')
          PY
      - name: WebUI unit tests
        run: python -m unittest discover -s webui/tests -v
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore .github/workflows/validate-tactile-webui.yml webui/static/shell.css webui/server.py
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Integrate WebUI monitoring and result routes [skip ci]'
            git push origin HEAD:feat/webui-review-monitoring
          fi
