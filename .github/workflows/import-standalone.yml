name: Import standalone tactile tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-standalone.yml

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[imported]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch standalone source tree
        run: |
          set -euo pipefail
          git clone --depth 1 --branch standalone/lf3r-tactile \
            https://github.com/Destiny-Peng/dissertation.git /tmp/tactile-source

      - name: Replace repository contents
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' /tmp/tactile-source/ "$GITHUB_WORKSPACE/"
          test -f README.md
          test -f webui/server.py
          test -f webui/tactile_service.py
          test -f webui/static/tactile/app.js
          test -f tools/run_sharpa_tactile_ablation.sh
          test -f tools/sharpa_tactile/common.py
          test "$(find tools/sharpa_tactile -maxdepth 1 -type f | wc -l)" -ge 40

      - name: Commit exact standalone import
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "[imported] Import standalone tactile WebUI and SHARPA tooling"
          git push origin HEAD:main
