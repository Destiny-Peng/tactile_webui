name: Apply flattened standalone layout
on:
  push:
    branches: [refactor/flatten-layout]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/flatten-layout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Flatten paths and add migration script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              text = text.replace(old, new, -1 if count is None else count)
              p.write_text(text)

          # WebUI defaults: standalone layout is flat. External old dissertation roots remain supported.
          replace('webui/server.py',
                  '"annotations_path": "annotations/failure_annotations/v1/records",',
                  '"annotations_path": "annotations/failure_annotations/records",')
          old = '''        self.manifest_path = (\n            self.source_root\n            / "datasets"\n            / "lf3r_failure_rollouts"\n            / "v1"\n            / "failrecovery_manifest.jsonl"\n        )\n        self.tactile = FailRecoveryTactileService(self.source_root, self.manifest_path)'''
          new = '''        dataset_root = self.source_root / "datasets" / "lf3r_failure_rollouts"\n        flat_manifest = dataset_root / "failrecovery_manifest.jsonl"\n        legacy_manifest = dataset_root / "v1" / "failrecovery_manifest.jsonl"\n        # Prefer the standalone flat layout, but keep old dissertation roots readable\n        # while migration is in progress.\n        self.manifest_path = (\n            flat_manifest\n            if flat_manifest.is_file() or not legacy_manifest.is_file()\n            else legacy_manifest\n        )\n        self.tactile = FailRecoveryTactileService(self.source_root, self.manifest_path)'''
          replace('webui/server.py', old, new)

          # Default tactile service path and every standalone SHARPA/helper default are flat.
          replace('webui/tactile_service.py',
                  '            / "lf3r_failure_rollouts"\n            / "v1"\n            / "failrecovery_manifest.jsonl"',
                  '            / "lf3r_failure_rollouts"\n            / "failrecovery_manifest.jsonl"')
          for path in [
              'tools/sharpa_tactile/prepare.py',
              'tools/plot_failrecovery_tactile.py',
              'tools/sharpa_tactile/align_gaussian_probability_curves.py',
          ]:
              p = Path(path)
              text = p.read_text().replace('datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl',
                                           'datasets/lf3r_failure_rollouts/failrecovery_manifest.jsonl')
              p.write_text(text)
          replace('tools/export_failrecovery_media.py',
                  'DATASET_ROOT = PROJECT_ROOT / "datasets/lf3r_failure_rollouts/v1"',
                  'DATASET_ROOT = PROJECT_ROOT / "datasets/lf3r_failure_rollouts"')

          # Tests use the flat standalone layout; keep one explicit legacy-v1 external-source test.
          p = Path('webui/tests/test_workspace.py')
          text = p.read_text()
          text = text.replace('root / "datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl"',
                              'root / "datasets/lf3r_failure_rollouts/failrecovery_manifest.jsonl"', 1)
          text = text.replace('app.root / "annotations/failure_annotations/v1/records"',
                              'app.root / "annotations/failure_annotations/records"')
          p.write_text(text)

          p = Path('webui/tests/test_tactile_service.py')
          p.write_text(p.read_text().replace(
              "self.root / 'datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl'",
              "self.root / 'datasets/lf3r_failure_rollouts/failrecovery_manifest.jsonl'"))

          # README: replace stale v1 structure and document the actual per-rollout annotation target.
          p = Path('README.md')
          text = p.read_text()
          text = text.replace('''datasets/\n  lf3r_failure_rollouts/\n    v1/\n      failrecovery_manifest.jsonl\n      failrecovery/\n      ...''',
                              '''datasets/\n  lf3r_failure_rollouts/\n    failrecovery_manifest.jsonl\n    failrecovery/\n    ...''')
          text = text.replace('The WebUI reads `datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl` there',
                              'The WebUI accepts the legacy `datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl` there')
          old_ann = '''The default writable annotation file is:\n\n```text\nannotations/tactile_intervals.jsonl\n```\n\nIf that file does not yet exist, the WebUI looks for the latest historical source matching:'''
          new_ann = '''Standalone annotations are stored one rollout per file under:\n\n```text\nannotations/failure_annotations/records/<rollout-id>.tactile.json\n```\n\nThis deliberately shares the original annotation root name without retaining the old `v1/` directory. Existing `<rollout-id>.json` LF3R records can coexist beside the tactile sidecars and are never overwritten.\n\nIf a tactile sidecar does not yet exist, the WebUI looks for the latest historical source matching:'''
          if old_ann in text:
              text = text.replace(old_ann, new_ann)
          marker = '## Run the WebUI\n'
          migration = '''## One-command migration\n\nTo make this repository self-contained from the dissertation/LF3R project, run:\n\n```bash\nbash tools/migrate_from_lf3r.sh /mnt/hdd/pyr/LF3R\n```\n\nThe script copies the exported fail-recovery dataset into the flat layout, rewrites manifest paths that still contain `/v1/`, migrates annotation records/events and USB interval seeds, and copies the encoder checkpoints plus the two external tactile repositories when present. It does not copy virtual environments, raw recorder SQLite data, or historical generated SHARPA runs.\n\n'''
          if migration not in text:
              text = text.replace(marker, migration + marker)
          p.write_text(text)
          PY

          cat > tools/migrate_from_lf3r.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          SOURCE_ROOT="${1:-/mnt/hdd/pyr/LF3R}"
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          TARGET_ROOT="$(cd "$SCRIPT_DIR/.." && pwd)"

          fail() { printf 'ERROR: %s\n' "$*" >&2; exit 1; }
          note() { printf '[migrate] %s\n' "$*"; }

          command -v rsync >/dev/null 2>&1 || fail "rsync is required"
          command -v python3 >/dev/null 2>&1 || fail "python3 is required"

          SOURCE_ROOT="$(cd "$SOURCE_ROOT" 2>/dev/null && pwd)" || fail "source root not found: $SOURCE_ROOT"
          [[ "$SOURCE_ROOT" != "$TARGET_ROOT" ]] || fail "source and target repositories must be different"

          LEGACY_DATA="$SOURCE_ROOT/datasets/lf3r_failure_rollouts/v1"
          FLAT_DATA="$SOURCE_ROOT/datasets/lf3r_failure_rollouts"
          if [[ -f "$LEGACY_DATA/failrecovery_manifest.jsonl" ]]; then
            SOURCE_DATA="$LEGACY_DATA"
            SOURCE_PREFIX='datasets/lf3r_failure_rollouts/v1/'
          elif [[ -f "$FLAT_DATA/failrecovery_manifest.jsonl" ]]; then
            SOURCE_DATA="$FLAT_DATA"
            SOURCE_PREFIX='datasets/lf3r_failure_rollouts/'
          else
            fail "failrecovery_manifest.jsonl not found under $SOURCE_ROOT/datasets/lf3r_failure_rollouts"
          fi

          TARGET_DATA="$TARGET_ROOT/datasets/lf3r_failure_rollouts"
          mkdir -p "$TARGET_DATA"

          note "copying fail-recovery export"
          [[ -d "$SOURCE_DATA/failrecovery" ]] || fail "missing exported episode directory: $SOURCE_DATA/failrecovery"
          rsync -a --info=stats2 "$SOURCE_DATA/failrecovery/" "$TARGET_DATA/failrecovery/"

          note "rewriting manifest into flat standalone layout"
          python3 - "$SOURCE_DATA/failrecovery_manifest.jsonl" "$TARGET_DATA/failrecovery_manifest.jsonl" "$SOURCE_PREFIX" <<'PY'
          import json, sys
          from pathlib import Path

          source, target, source_prefix = map(Path, sys.argv[1:3]) + [None] if False else (None, None, None)
          PY
          SH

          # Replace the intentionally compact placeholder Python block with a correct block.
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/migrate_from_lf3r.sh')
          text = p.read_text()
          bad = '''          python3 - "$SOURCE_DATA/failrecovery_manifest.jsonl" "$TARGET_DATA/failrecovery_manifest.jsonl" "$SOURCE_PREFIX" <<'PY'\n          import json, sys\n          from pathlib import Path\n\n          source, target, source_prefix = map(Path, sys.argv[1:3]) + [None] if False else (None, None, None)\n          PY\n          SH\n'''
          good = r'''python3 - "$SOURCE_DATA/failrecovery_manifest.jsonl" "$TARGET_DATA/failrecovery_manifest.jsonl" "$SOURCE_PREFIX" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          source_prefix = sys.argv[3]
          flat_prefix = "datasets/lf3r_failure_rollouts/"

          def rewrite(value):
              if isinstance(value, str):
                  return flat_prefix + value[len(source_prefix):] if value.startswith(source_prefix) else value
              if isinstance(value, list):
                  return [rewrite(item) for item in value]
              if isinstance(value, dict):
                  return {key: rewrite(item) for key, item in value.items()}
              return value

          rows = []
          for line_number, line in enumerate(source.read_text(encoding="utf-8").splitlines(), 1):
              if not line.strip():
                  continue
              row = json.loads(line)
              if not isinstance(row, dict):
                  raise SystemExit(f"manifest line {line_number} is not an object")
              rows.append(rewrite(row))
          target.write_text("".join(json.dumps(row, ensure_ascii=False, separators=(",", ":")) + "\n" for row in rows), encoding="utf-8")
          print(f"rewrote {len(rows)} manifest rows")
          PY

          note "flattening any annotations already created in this standalone repo"
          if [[ -d "$TARGET_ROOT/annotations/failure_annotations/v1" ]]; then
            mkdir -p "$TARGET_ROOT/annotations/failure_annotations/records" "$TARGET_ROOT/annotations/failure_annotations/events"
            [[ ! -d "$TARGET_ROOT/annotations/failure_annotations/v1/records" ]] || \
              rsync -a --ignore-existing "$TARGET_ROOT/annotations/failure_annotations/v1/records/" "$TARGET_ROOT/annotations/failure_annotations/records/"
            [[ ! -d "$TARGET_ROOT/annotations/failure_annotations/v1/events" ]] || \
              rsync -a --ignore-existing "$TARGET_ROOT/annotations/failure_annotations/v1/events/" "$TARGET_ROOT/annotations/failure_annotations/events/"
            rm -rf "$TARGET_ROOT/annotations/failure_annotations/v1"
          fi

          note "migrating annotation records and save-event history"
          SOURCE_ANN=""
          if [[ -d "$SOURCE_ROOT/annotations/failure_annotations/v1" ]]; then
            SOURCE_ANN="$SOURCE_ROOT/annotations/failure_annotations/v1"
          elif [[ -d "$SOURCE_ROOT/annotations/failure_annotations" ]]; then
            SOURCE_ANN="$SOURCE_ROOT/annotations/failure_annotations"
          fi
          if [[ -n "$SOURCE_ANN" ]]; then
            mkdir -p "$TARGET_ROOT/annotations/failure_annotations/records" "$TARGET_ROOT/annotations/failure_annotations/events"
            [[ ! -d "$SOURCE_ANN/records" ]] || rsync -a --ignore-existing "$SOURCE_ANN/records/" "$TARGET_ROOT/annotations/failure_annotations/records/"
            [[ ! -d "$SOURCE_ANN/events" ]] || rsync -a --ignore-existing "$SOURCE_ANN/events/" "$TARGET_ROOT/annotations/failure_annotations/events/"
          else
            note "no annotation directory found; skipping"
          fi

          note "migrating USB interval seeds"
          if [[ -d "$SOURCE_ROOT/outputs/usb_event_intervals" ]]; then
            mkdir -p "$TARGET_ROOT/outputs/usb_event_intervals"
            rsync -a --ignore-existing "$SOURCE_ROOT/outputs/usb_event_intervals/" "$TARGET_ROOT/outputs/usb_event_intervals/"
          else
            note "no outputs/usb_event_intervals found; skipping"
          fi

          note "migrating frozen tactile encoders"
          if [[ -d "$SOURCE_ROOT/checkpoints/T-Rex/encoders" ]]; then
            mkdir -p "$TARGET_ROOT/checkpoints/T-Rex/encoders"
            rsync -a --ignore-existing "$SOURCE_ROOT/checkpoints/T-Rex/encoders/" "$TARGET_ROOT/checkpoints/T-Rex/encoders/"
          else
            note "no checkpoints/T-Rex/encoders found; skipping"
          fi

          note "migrating external tactile repositories"
          for repo in T-Rex sharpawave-deform-encoder; do
            if [[ -d "$SOURCE_ROOT/repos/$repo" ]]; then
              mkdir -p "$TARGET_ROOT/repos/$repo"
              rsync -a --exclude '.venv' --exclude '__pycache__' "$SOURCE_ROOT/repos/$repo/" "$TARGET_ROOT/repos/$repo/"
            else
              note "no repos/$repo found; skipping"
            fi
          done

          note "forcing standalone settings to use migrated local data"
          python3 - "$TARGET_ROOT/.tactile_webui/settings.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = {}
          if path.is_file():
              try:
                  loaded = json.loads(path.read_text(encoding="utf-8"))
                  if isinstance(loaded, dict):
                      data.update(loaded)
              except Exception:
                  pass
          data["source_project_root"] = "."
          data["annotations_path"] = "annotations/failure_annotations/records"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

          note "verifying all manifest runtime paths"
          python3 - "$TARGET_ROOT" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          manifest = root / "datasets/lf3r_failure_rollouts/failrecovery_manifest.jsonl"
          prefix = "datasets/lf3r_failure_rollouts/v1/"
          missing = []
          rows = 0
          for line in manifest.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              rows += 1
              for value in (row.get("camera_video_paths") or {}).values():
                  if value and not (root / value).is_file(): missing.append(value)
              for key in ("synchronized_frames_path", "tactile_events_path"):
                  value = row.get(key)
                  if value and not (root / value).is_file(): missing.append(value)
              for entry in (row.get("tactile_stream_paths") or {}).values():
                  if not isinstance(entry, dict): continue
                  for value in entry.values():
                      if value and not (root / value).is_file(): missing.append(value)
          if prefix in manifest.read_text(encoding="utf-8"):
              raise SystemExit("legacy /v1/ path remains in migrated manifest")
          if missing:
              sample = "\n  ".join(missing[:20])
              raise SystemExit(f"{len(missing)} referenced files are missing:\n  {sample}")
          print(f"verified {rows} rollouts; every runtime file exists")
          PY

          note "migration complete"
          printf '\nStandalone layout:\n'
          printf '  datasets/lf3r_failure_rollouts/failrecovery_manifest.jsonl\n'
          printf '  datasets/lf3r_failure_rollouts/failrecovery/\n'
          printf '  annotations/failure_annotations/records/\n'
          printf '  outputs/usb_event_intervals/\n'
          printf '\nStart with:\n  python webui/server.py --root . --host 127.0.0.1 --port 8765\n'
          '''
          if bad not in text:
              raise SystemExit('migration script placeholder not found')
          p.write_text(text.replace(bad, good))
          PY
          chmod +x tools/migrate_from_lf3r.sh
      - name: Validate
        shell: bash
        run: |
          bash -n tools/migrate_from_lf3r.sh
          python -m compileall -q webui tools/sharpa_tactile tools/export_failrecovery_media.py tools/plot_failrecovery_tactile.py
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
          python -m unittest discover -s webui/tests -v
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md webui tools
          if ! git diff --cached --quiet; then
            git commit -m "Flatten standalone tactile data layout"
            git push origin HEAD:refactor/flatten-layout
          fi
