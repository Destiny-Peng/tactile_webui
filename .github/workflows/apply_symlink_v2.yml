name: Apply symlink data-source v2
on:
  push:
    branches: [fix/symlink-data-source-v2]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/symlink-data-source-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply resolver patch
        shell: bash
        run: |
          python tools/_apply_symlink_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path("webui/tests/test_workspace.py")
          text = path.read_text(encoding="utf-8")
          old = '        app.save_settings({**app.settings, "source_project_root": "."})\n        self.assertEqual(app.manifest_path, old_manifest.resolve())\n'
          new = '        app = TactileApplication(app.root)\n        self.assertEqual(app.manifest_path, old_manifest.resolve())\n'
          if old not in text:
              raise SystemExit("symlink test reload block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate
        shell: bash
        run: |
          bash -n tools/migrate_from_lf3r.sh
          python -m compileall -q webui tools/materialize_tactile_images.py
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
          python -m unittest discover -s webui/tests -v
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md webui/server.py webui/tests/test_workspace.py
          if ! git diff --cached --quiet; then
            git commit -m "Resolve symlinked LF3R manifests [skip ci]"
            git push origin HEAD:fix/symlink-data-source-v2
          fi
