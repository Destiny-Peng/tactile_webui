name: Apply flattened standalone layout
on:
  push:
    branches: [refactor/flatten-layout]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/flatten-layout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply changes
        shell: bash
        run: |
          echo '## One-command migration\n\n"CgoKICAgICJTo make this repository self-contained from the dissertation/LF3R project, run:\n\n"CgoKICAgICJ```bash\n"CgoKICAgICJbash tools/migrate_from_lf3r.sh /mnt/hdd/pyr/LF3R\n"CgoKICAgICJ```\n\n"CgoKICAgICJThe script copies the exported fail-recovery dataset into the flat layout, rewrites manifest paths that still contain `/v1/`, "CgoKICAgICJmigrates annotation records/events and USB interval seeds, and copies the encoder checkpoints plus the two external tactile repositories when present. "CgoKICAgICJIt does not copy virtual environments, raw recorder SQLite data, or historical generated SHARPA runs.\n\n"' | base64 -d | python
          echo ' ' | base64 -d > tools/migrate_from_lf3r.sh
          chmod +x tools/migrate_from_lf3r.sh
      - name: Validate
        shell: bash
        run: |
          bash -n tools/migrate_from_lf3r.sh
          python -m compileall -q webui tools/sharpa_tactile tools/export_failrecovery_media.py tools/plot_failrecovery_tactile.py
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
          python -m unittest discover -s webui/tests -v
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md webui tools
          if ! git diff --cached --quiet; then
            git commit -m "Flatten standalone tactile data layout"
            git push origin HEAD:refactor/flatten-layout
          fi
