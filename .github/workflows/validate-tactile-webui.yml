name: Validate tactile WebUI

on:
  push:
    branches:
      - feat/full-tactile-webui-shell
  pull_request:
    paths:
      - 'webui/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/validate-tactile-webui.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m compileall -q webui tools/sharpa_tactile tools/export_failrecovery_media.py tools/plot_failrecovery_tactile.py
      - name: Shell syntax
        run: bash -n tools/migrate_from_lf3r.sh
      - name: JavaScript syntax
        run: |
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
      - name: WebUI unit tests
        run: python -m unittest discover -s webui/tests -v
