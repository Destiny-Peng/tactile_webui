name: Apply static tactile images

on:
  push:
    branches: [feat/static-tactile-images]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/static-tactile-images
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration patch
        run: python tools/apply_static_tactile_patch.py
      - name: Python syntax
        run: python -m compileall -q webui tools
      - name: JavaScript syntax
        run: |
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
      - name: Shell syntax
        run: bash -n tools/migrate_from_lf3r.sh
      - name: Unit tests
        run: python -m unittest discover -s webui/tests -v
      - name: Static-image contract
        run: |
          python - <<'PY'
          from pathlib import Path
          shell = Path('webui/static/shell.js').read_text()
          tactile = Path('webui/static/tactile/app.js').read_text()
          service = Path('webui/tactile_service.py').read_text()
          assert '/sprite?' not in shell
          assert 'annotateTactileGrid' in shell
          assert '/image?finger=' in shell
          assert '\n    applySprite(record, camera' not in tactile
          assert 'static_image_path' in service
          print('static tactile image contract OK')
          PY
      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md webui/tactile_service.py webui/static/index.html webui/static/shell.css webui/static/shell.js webui/static/tactile/app.js webui/static/tactile/styles.css tools/migrate_from_lf3r.sh tools/export_failrecovery_media.py
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Use materialized tactile images [skip ci]'
            git push origin HEAD:feat/static-tactile-images
          fi
