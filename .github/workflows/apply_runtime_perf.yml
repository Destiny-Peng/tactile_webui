name: Apply runtime performance integration

on:
  push:
    branches: [perf/webui-runtime]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/webui-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python tools/_apply_runtime_perf_patch.py
      - name: Validate
        run: |
          python -m compileall -q webui tools
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
          bash -n tools/migrate_from_lf3r.sh
          python -m unittest discover -s webui/tests -v
          python - <<'PY'
          from pathlib import Path
          server = Path('webui/server.py').read_text()
          shell = Path('webui/static/shell.js').read_text()
          tactile = Path('webui/static/tactile/app.js').read_text()
          assert 'protocol_version = "HTTP/1.1"' in server
          assert 'Connection", "close"' not in server
          assert 'tactileLoadActive' in shell and 'drainAnnotateTactileQueue' in shell
          assert 'imageLoadActive' in tactile and 'drainSynchronizedFrameQueue' in tactile
          print('runtime performance contract OK')
          PY
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webui/server.py webui/static/shell.js webui/static/tactile/app.js
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Add runtime backpressure and HTTP keep-alive [skip ci]'
            git push origin HEAD:perf/webui-runtime
          fi
