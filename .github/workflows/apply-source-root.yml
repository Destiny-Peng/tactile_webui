name: Apply external source root
on:
  push:
    branches: [fix/external-source-root]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch data source resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('webui/tactile_service.py')
          s = p.read_text()
          s = s.replace('"""FailRecovery tactile reader used only by the LF3R Results WebUI."""', '"""FailRecovery tactile reader for the standalone tactile WebUI."""')
          old = '''    def __init__(self, project_root: Path) -> None:\n        self.project_root = project_root.resolve()\n        self.manifest_path = (\n            self.project_root\n            / "datasets"\n            / "lf3r_failure_rollouts"\n            / "v1"\n            / "failrecovery_manifest.jsonl"\n        )\n'''
          new = '''    def __init__(self, project_root: Path, manifest_path: Path | None = None) -> None:\n        self.project_root = project_root.expanduser().resolve()\n        self.manifest_path = (manifest_path or (\n            self.project_root\n            / "datasets"\n            / "lf3r_failure_rollouts"\n            / "v1"\n            / "failrecovery_manifest.jsonl"\n        )).expanduser().resolve()\n        try:\n            self.manifest_path.relative_to(self.project_root)\n        except ValueError as exc:\n            raise ValueError("manifest path escapes source project root") from exc\n'''
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('webui/server.py')
          s = p.read_text()
          s = s.replace('''DEFAULT_SETTINGS: dict[str, Any] = {\n    "annotations_path": "annotations/failure_annotations/v1/records",''', '''DEFAULT_SETTINGS: dict[str, Any] = {\n    "source_project_root": ".",\n    "annotations_path": "annotations/failure_annotations/v1/records",''')
          old = '''        self.static_root = (Path(__file__).resolve().parent / "static").resolve()\n        self.manifest_path = (\n            self.root\n            / "datasets"\n            / "lf3r_failure_rollouts"\n            / "v1"\n            / "failrecovery_manifest.jsonl"\n        )\n        self.settings_path = self.root / ".tactile_webui" / "settings.json"\n        self._settings = self._load_settings()\n        self.tactile = FailRecoveryTactileService(self.root)\n        self._rollouts: list[dict[str, Any]] | None = None\n        self._rollout_map: dict[str, dict[str, Any]] | None = None\n        self._annotation_lock = threading.RLock()\n'''
          new = '''        self.static_root = (Path(__file__).resolve().parent / "static").resolve()\n        self.settings_path = self.root / ".tactile_webui" / "settings.json"\n        self._settings = self._load_settings()\n        self._rollouts: list[dict[str, Any]] | None = None\n        self._rollout_map: dict[str, dict[str, Any]] | None = None\n        self._annotation_lock = threading.RLock()\n        self._configure_data_source()\n'''
          assert old in s
          s = s.replace(old, new)
          marker = '''    # ---------- generic filesystem helpers ----------\n\n    def project_file(self, value: Any, suffix: str | None = None) -> Path:\n'''
          replacement = '''    # ---------- generic filesystem helpers ----------\n\n    def _configure_data_source(self) -> None:\n        raw = str(self._settings.get("source_project_root") or ".").strip()\n        source = Path(raw).expanduser()\n        if not source.is_absolute():\n            source = self.root / source\n        self.source_root = source.resolve()\n        self.manifest_path = (\n            self.source_root\n            / "datasets"\n            / "lf3r_failure_rollouts"\n            / "v1"\n            / "failrecovery_manifest.jsonl"\n        )\n        self.tactile = FailRecoveryTactileService(self.source_root, self.manifest_path)\n        self._rollouts = None\n        self._rollout_map = None\n\n    @staticmethod\n    def _display_path(path: Path, base: Path) -> str:\n        try:\n            return str(path.relative_to(base))\n        except ValueError:\n            return str(path)\n\n    def project_file(self, value: Any, suffix: str | None = None) -> Path:\n'''
          assert marker in s
          s = s.replace(marker, replacement)
          needle = '''        if suffix and path.suffix.lower() != suffix.lower():\n            raise ValueError(f"expected {suffix} file")\n        return path\n\n    @staticmethod\n    def _read_jsonl'''
          repl = '''        if suffix and path.suffix.lower() != suffix.lower():\n            raise ValueError(f"expected {suffix} file")\n        return path\n\n    def source_file(self, value: Any, suffix: str | None = None) -> Path:\n        if not isinstance(value, str) or not value.strip():\n            raise ValueError("missing source-project-relative path")\n        raw = Path(value).expanduser()\n        path = raw.resolve() if raw.is_absolute() else (self.source_root / raw).resolve()\n        try:\n            path.relative_to(self.source_root)\n        except ValueError as exc:\n            raise ValueError("source data path escapes source project root") from exc\n        if suffix and path.suffix.lower() != suffix.lower():\n            raise ValueError(f"expected {suffix} file")\n        return path\n\n    @staticmethod\n    def _read_jsonl'''
          assert needle in s
          s = s.replace(needle, repl)
          old = '''            value = payload[key]\n            if key in {"annotations_path", "annotation_seed_glob", "runs_root"}:\n                if not isinstance(value, str) or not value.strip():\n                    raise ValueError(f"{key} must be a non-empty relative path")\n                if Path(value).is_absolute() or ".." in Path(value).parts:\n                    raise ValueError(f"{key} must remain inside the repository")\n                settings[key] = value.strip()\n            elif key == "default_camera":'''
          new = '''            value = payload[key]\n            if key == "source_project_root":\n                if not isinstance(value, str) or not value.strip():\n                    raise ValueError("source_project_root must be a non-empty path")\n                candidate = Path(value).expanduser()\n                if not candidate.is_absolute():\n                    candidate = self.root / candidate\n                if not candidate.resolve().is_dir():\n                    raise ValueError("source_project_root does not exist or is not a directory")\n                settings[key] = value.strip()\n            elif key in {"annotations_path", "annotation_seed_glob", "runs_root"}:\n                if not isinstance(value, str) or not value.strip():\n                    raise ValueError(f"{key} must be a non-empty relative path")\n                if Path(value).is_absolute() or ".." in Path(value).parts:\n                    raise ValueError(f"{key} must remain inside the repository")\n                settings[key] = value.strip()\n            elif key == "default_camera":'''
          assert old in s
          s = s.replace(old, new)
          old = '''        self._settings = settings\n        self._atomic_text(self.settings_path, json.dumps(settings, indent=2, ensure_ascii=False) + "\\n")\n        return self.settings\n'''
          new = '''        source_changed = settings.get("source_project_root") != self._settings.get("source_project_root")\n        self._settings = settings\n        self._atomic_text(self.settings_path, json.dumps(settings, indent=2, ensure_ascii=False) + "\\n")\n        if source_changed:\n            self._configure_data_source()\n        return self.settings\n'''
          assert old in s
          s = s.replace(old, new)
          s = s.replace('row.setdefault("manifest_source", str(self.manifest_path.relative_to(self.root)))', 'row.setdefault("manifest_source", self._display_path(self.manifest_path, self.source_root))')
          s = s.replace('(path for path in self.root.glob(pattern) if path.is_file())', '(path for path in self.source_root.glob(pattern) if path.is_file())')
          s = s.replace('"path": str(self.manifest_path.relative_to(self.root)),', '"path": self._display_path(self.manifest_path, self.source_root),')
          s = s.replace('"annotation_source": str(source.relative_to(self.root)) if source else None,', '"annotation_source": self._display_path(source, self.source_root) if source else None,')
          s = s.replace('"annotation_source": str(self.annotation_seed_path().relative_to(self.root)) if self.annotation_seed_path() else None,', '"annotation_source": self._display_path(self.annotation_seed_path(), self.source_root) if self.annotation_seed_path() else None,')
          s = s.replace('"manifest_path": str(self.app.manifest_path.relative_to(self.app.root)),', '"manifest_path": self.app._display_path(self.app.manifest_path, self.app.source_root),\n                        "source_project_root_resolved": str(self.app.source_root),')
          s = s.replace('"annotation_source": str(source.relative_to(self.app.root)) if source else None,', '"annotation_source": self.app._display_path(source, self.app.source_root) if source else None,')
          s = s.replace('self.serve_video(self.app.project_file(camera_paths.get(camera), ".mp4"))', 'self.serve_video(self.app.source_file(camera_paths.get(camera), ".mp4"))')
          p.write_text(s)

          p = Path('webui/static/index.html')
          s = p.read_text()
          old = '<label class="field"><span>Dataset manifest</span><input id="settingsManifest" class="text-input" readonly></label>'
          new = '<label class="field"><span>Source project root</span><input id="settingsSourceRoot" class="text-input" name="source_project_root" placeholder="/path/to/original/project"></label>\n            <label class="field"><span>Dataset manifest</span><input id="settingsManifest" class="text-input" readonly></label>'
          assert old in s
          p.write_text(s.replace(old, new))

          p = Path('webui/static/shell.js')
          s = p.read_text()
          s = s.replace('byId("settingsManifest").value = payload.manifest_path || "";', 'byId("settingsSourceRoot").value = settings.source_project_root || ".";\n    byId("settingsManifest").value = payload.source_project_root_resolved\n      ? payload.source_project_root_resolved + "/" + (payload.manifest_path || "")\n      : (payload.manifest_path || "");')
          s = s.replace('''  var payload = {\n    annotations_path: byId("settingsAnnotations").value.trim(),''', '''  var payload = {\n    source_project_root: byId("settingsSourceRoot").value.trim(),\n    annotations_path: byId("settingsAnnotations").value.trim(),''')
          p.write_text(s)

          p = Path('webui/tests/test_workspace.py')
          s = p.read_text()
          insert = '''\n    def test_external_source_project_root_resolves_manifest_paths(self):\n        temporary, app = self.make_app()\n        self.addCleanup(temporary.cleanup)\n        external = app.root / "old_project"\n        manifest = external / "datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl"\n        manifest.parent.mkdir(parents=True)\n        video = external / "datasets/shared/video.mp4"\n        video.parent.mkdir(parents=True)\n        video.write_bytes(b"video")\n        manifest.write_text(json.dumps({\n            "id": "usb_external", "task_key": "usb_insert", "total_frames": 1, "fps": 30,\n            "camera_video_paths": {"cam_high": "datasets/shared/video.mp4"}\n        }) + "\\n")\n        app.save_settings({**app.settings, "source_project_root": str(external)})\n        self.assertEqual(app.manifest_path, manifest.resolve())\n        self.assertEqual(app.source_file("datasets/shared/video.mp4"), video.resolve())\n        self.assertIn("usb_external", app.rollout_map())\n\n'''
          marker = '\n    def test_rejects_invalid_interval(self):\n'
          assert marker in s
          p.write_text(s.replace(marker, insert + marker))

          p = Path('README.md')
          s = p.read_text()
          s = s.replace('Copy the dataset into this repository or symlink `datasets/lf3r_failure_rollouts` to the existing dataset location.', 'Do not symlink the dataset tree when the manifest contains paths relative to the original project root. In **Settings → Source project root**, point directly to that original project (for example `/mnt/hdd/pyr/LF3R`). The WebUI reads `datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl` there and resolves every exported relative video/tactile path against the same source root. The standalone repository keeps its own annotations and experiment outputs.')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python -m py_compile webui/server.py webui/tactile_service.py
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
          python -m unittest webui.tests.test_tactile_service webui.tests.test_workspace -v
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/apply-source-root.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md webui
          git commit -m "Support external source project roots"
          git push origin HEAD:fix/external-source-root
