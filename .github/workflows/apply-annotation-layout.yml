name: Apply annotation records layout

on:
  push:
    branches: [fix/annotation-path-layout]

jobs:
  migrate:
    if: github.event.head_commit.message != 'Use original annotation records layout'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/annotation-path-layout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update annotation storage layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('webui/server.py')
          text = path.read_text()
          text = text.replace('"annotations_path": "annotations/tactile_intervals.jsonl",', '"annotations_path": "annotations/failure_annotations/v1/records",')

          old = '''    def annotation_target_path(self) -> Path:\n        return self.project_file(self._settings["annotations_path"], ".jsonl")\n\n    def annotation_seed_path(self) -> Path | None:\n        target = self.annotation_target_path()\n        if target.is_file():\n            return target\n        pattern = str(self._settings["annotation_seed_glob"])\n        candidates = sorted(\n            (path for path in self.root.glob(pattern) if path.is_file()),\n            key=lambda path: (path.stat().st_mtime_ns, str(path)),\n        )\n        return candidates[-1] if candidates else None\n\n    def load_annotation_rows(self) -> tuple[list[dict[str, Any]], Path | None]:\n        with self._annotation_lock:\n            source = self.annotation_seed_path()\n            rows = self._read_jsonl(source) if source is not None else []\n            return rows, source\n'''
          new = '''    def annotation_target_path(self) -> Path:\n        """Directory matching the original LF3R annotation record layout."""\n        return self.project_file(self._settings["annotations_path"])\n\n    def annotation_record_path(self, rollout_id: str) -> Path:\n        if not re.fullmatch(r"[A-Za-z0-9._-]{1,160}", rollout_id):\n            raise ValueError("invalid rollout id")\n        return self.annotation_target_path() / f"{rollout_id}.tactile.json"\n\n    def annotation_seed_path(self) -> Path | None:\n        pattern = str(self._settings["annotation_seed_glob"])\n        candidates = sorted(\n            (path for path in self.root.glob(pattern) if path.is_file()),\n            key=lambda path: (path.stat().st_mtime_ns, str(path)),\n        )\n        return candidates[-1] if candidates else None\n\n    def _record_annotation_rows(self) -> list[dict[str, Any]]:\n        records_dir = self.annotation_target_path()\n        if not records_dir.is_dir():\n            return []\n        rows: list[dict[str, Any]] = []\n        for path in sorted(records_dir.glob("*.tactile.json")):\n            try:\n                record = json.loads(path.read_text(encoding="utf-8"))\n            except (OSError, json.JSONDecodeError):\n                continue\n            if not isinstance(record, dict):\n                continue\n            rollout_id = str(record.get("rollout_id") or path.name.removesuffix(".tactile.json"))\n            intervals = record.get("tactile_intervals")\n            if not isinstance(intervals, list):\n                continue\n            for raw in intervals:\n                if isinstance(raw, dict):\n                    item = dict(raw)\n                    item["rollout_id"] = rollout_id\n                    rows.append(item)\n        return rows\n\n    def load_annotation_rows(self) -> tuple[list[dict[str, Any]], Path | None]:\n        with self._annotation_lock:\n            seed = self.annotation_seed_path()\n            rows = self._read_jsonl(seed) if seed is not None else []\n            record_rows = self._record_annotation_rows()\n            edited_rollouts = {str(row.get("rollout_id") or "") for row in record_rows}\n            if edited_rollouts:\n                rows = [row for row in rows if str(row.get("rollout_id") or "") not in edited_rollouts]\n                rows.extend(record_rows)\n                return rows, self.annotation_target_path()\n            return rows, seed\n'''
          if old not in text:
              raise SystemExit('annotation path block not found')
          text = text.replace(old, new)

          start = text.index('    def save_rollout_annotations(self, rollout_id: str, events: Any) -> list[dict[str, Any]]:\n')
          end = text.index('\n    def rollout_payload(self) -> dict[str, Any]:', start)
          replacement = '''    def save_rollout_annotations(self, rollout_id: str, events: Any) -> list[dict[str, Any]]:\n        normalized = self._validate_events(rollout_id, events)\n        target = self.annotation_record_path(rollout_id)\n        with self._annotation_lock:\n            previous: dict[str, Any] = {}\n            if target.is_file():\n                try:\n                    loaded = json.loads(target.read_text(encoding="utf-8"))\n                    if isinstance(loaded, dict):\n                        previous = loaded\n                except (OSError, json.JSONDecodeError):\n                    previous = {}\n            now = datetime.now().astimezone().isoformat()\n            record = {\n                "schema_version": "tactile_intervals_v1",\n                "rollout_id": rollout_id,\n                "review_status": "complete" if normalized else "unreviewed",\n                "created_at": previous.get("created_at", now),\n                "updated_at": now,\n                "tactile_intervals": normalized,\n            }\n            self._atomic_text(target, json.dumps(record, indent=2, ensure_ascii=False) + "\\n")\n            return normalized\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          html = Path('webui/static/index.html')
          h = html.read_text()
          h = h.replace('<span>Annotation target</span>', '<span>Annotation records directory</span>')
          h = h.replace('<strong>Currently loaded annotation source:</strong>', '<strong>Currently loaded annotation source:</strong>')
          html.write_text(h)

          readme = Path('README.md')
          r = readme.read_text()
          marker = 'The standalone workspace keeps the same five-page shape as the dissertation WebUI, but only for tactile data and SHARPA experiments.'
          if marker in r:
              r = r.replace(marker, marker + '\n\nTactile interval annotations use the original annotation root layout: `annotations/failure_annotations/v1/records/`. Each edited rollout is stored as `<rollout-id>.tactile.json` so existing `<rollout-id>.json` LF3R annotation records are not overwritten. Historical `outputs/usb_event_intervals/*/intervals.jsonl` files remain read-only seeds for rollouts that have not yet been edited in the standalone UI.')
          readme.write_text(r)
          PY
      - name: Update tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('webui/tests/test_workspace.py')
          text = path.read_text()
          text = text.replace('self.assertTrue(app.annotation_target_path().is_file())', 'self.assertEqual(app.annotation_target_path(), app.root / "annotations/failure_annotations/v1/records")\n        self.assertTrue(app.annotation_record_path("usb_001").is_file())\n        record = json.loads(app.annotation_record_path("usb_001").read_text())\n        self.assertEqual([row["event_key"] for row in record["tactile_intervals"]], [6, 7, 8, 9])')
          insert = '''\n    def test_existing_lf3r_record_is_not_overwritten(self):\n        temporary, app = self.make_app()\n        self.addCleanup(temporary.cleanup)\n        records = app.root / "annotations/failure_annotations/v1/records"\n        records.mkdir(parents=True)\n        legacy = records / "usb_001.json"\n        legacy.write_text(json.dumps({"schema_version": 2, "rollout_id": "usb_001", "notes": "keep me"}))\n        app.save_rollout_annotations("usb_001", [{"event_key": 8, "start_frame": 10, "end_frame": 20}])\n        self.assertEqual(json.loads(legacy.read_text())["notes"], "keep me")\n        self.assertTrue((records / "usb_001.tactile.json").is_file())\n'''
          anchor = '\n    def test_rejects_invalid_interval(self):\n'
          if insert.strip() not in text:
              text = text.replace(anchor, insert + anchor)
          path.write_text(text)
          PY
      - name: Validate
        run: |
          python -m py_compile webui/server.py webui/tactile_service.py
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
          python -m unittest webui.tests.test_tactile_service webui.tests.test_workspace -v
      - name: Commit changes
        run: |
          rm .github/workflows/apply-annotation-layout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Use original annotation records layout'
          git push origin HEAD:fix/annotation-path-layout
