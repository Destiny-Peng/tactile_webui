name: Finalize WebUI review overhaul

on:
  push:
    branches: [feat/webui-review-monitoring]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webui-review-monitoring
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final cleanup
        run: python tools/finalize_webui_overhaul.py
      - name: Validate Python
        run: python -m compileall -q webui tools/sharpa_tactile
      - name: Validate JavaScript
        run: |
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
      - name: Validate shell
        run: bash -n tools/migrate_from_lf3r.sh
      - name: Validate DOM contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('webui/static/index.html').read_text()
          js=Path('webui/static/shell.js').read_text()
          ids=set(re.findall(r'\bid="([^"]+)"',html))
          refs=set(re.findall(r'byId\("([^"]+)"\)',js))
          missing=sorted(refs-ids-{'resultsCurvePlayhead','resultsCurvePoint'})
          if missing: raise SystemExit('missing DOM ids: '+', '.join(missing))
          if any(word in html for word in ('Align failure','Insert failure','Align success','Insert success')):
              raise SystemExit('semantic annotation labels remain in main UI')
          print('DOM contract and numeric-label UI OK')
          PY
      - name: Run unit tests
        run: python -m unittest discover -s webui/tests -v
      - name: Commit generated cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md webui/server.py webui/static/shell.css webui/static/shell.js webui/tests/test_workspace.py
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Finalize numeric labels and low-overhead diagnostics [skip ci]'
            git push origin HEAD:feat/webui-review-monitoring
          fi
