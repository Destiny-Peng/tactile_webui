name: Apply flattened standalone layout
on:
  push:
    branches: [refactor/flatten-layout]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/flatten-layout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply idempotent path changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding="utf-8")

          edit("webui/server.py", [
              ('"annotations_path": "annotations/failure_annotations/v1/records",',
               '"annotations_path": "annotations/failure_annotations/records",'),
              ('''        self.manifest_path = (\n            self.source_root\n            / "datasets"\n            / "lf3r_failure_rollouts"\n            / "v1"\n            / "failrecovery_manifest.jsonl"\n        )\n        self.tactile = FailRecoveryTactileService(self.source_root, self.manifest_path)''',
               '''        dataset_root = self.source_root / "datasets" / "lf3r_failure_rollouts"\n        flat_manifest = dataset_root / "failrecovery_manifest.jsonl"\n        legacy_manifest = dataset_root / "v1" / "failrecovery_manifest.jsonl"\n        # Prefer the standalone flat layout, while still allowing an old\n        # dissertation root to be used before migration.\n        self.manifest_path = (\n            flat_manifest\n            if flat_manifest.is_file() or not legacy_manifest.is_file()\n            else legacy_manifest\n        )\n        self.tactile = FailRecoveryTactileService(self.source_root, self.manifest_path)'''),
          ])

          edit("webui/tactile_service.py", [
              ('            / "lf3r_failure_rollouts"\n            / "v1"\n            / "failrecovery_manifest.jsonl"',
               '            / "lf3r_failure_rollouts"\n            / "failrecovery_manifest.jsonl"'),
          ])

          for path in (
              "tools/sharpa_tactile/prepare.py",
              "tools/plot_failrecovery_tactile.py",
              "tools/sharpa_tactile/align_gaussian_probability_curves.py",
          ):
              edit(path, [
                  ("datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl",
                   "datasets/lf3r_failure_rollouts/failrecovery_manifest.jsonl"),
              ])

          edit("tools/export_failrecovery_media.py", [
              ('DATASET_ROOT = PROJECT_ROOT / "datasets/lf3r_failure_rollouts/v1"',
               'DATASET_ROOT = PROJECT_ROOT / "datasets/lf3r_failure_rollouts"'),
          ])

          p = Path("webui/tests/test_workspace.py")
          text = p.read_text(encoding="utf-8")
          old = 'root / "datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl"'
          flat = 'root / "datasets/lf3r_failure_rollouts/failrecovery_manifest.jsonl"'
          if old in text and flat not in text:
              text = text.replace(old, flat, 1)
          text = text.replace(
              'app.root / "annotations/failure_annotations/v1/records"',
              'app.root / "annotations/failure_annotations/records"',
          )
          p.write_text(text, encoding="utf-8")

          edit("webui/tests/test_tactile_service.py", [
              ("self.root / 'datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl'",
               "self.root / 'datasets/lf3r_failure_rollouts/failrecovery_manifest.jsonl'"),
          ])

          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "datasets/\n  lf3r_failure_rollouts/\n    v1/\n      failrecovery_manifest.jsonl\n      failrecovery/\n      ...",
              "datasets/\n  lf3r_failure_rollouts/\n    failrecovery_manifest.jsonl\n    failrecovery/\n    ...",
          )
          text = text.replace(
              "The WebUI reads `datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl` there",
              "The WebUI also accepts the legacy `datasets/lf3r_failure_rollouts/v1/failrecovery_manifest.jsonl` there",
          )
          old_annotation = """The default writable annotation file is:\n\n```text\nannotations/tactile_intervals.jsonl\n```\n\nIf that file does not yet exist, the WebUI looks for the latest historical source matching:"""
          new_annotation = """Standalone annotations are stored one rollout per file under:\n\n```text\nannotations/failure_annotations/records/<rollout-id>.tactile.json\n```\n\nExisting `<rollout-id>.json` LF3R records can coexist beside the tactile sidecars and are never overwritten. If a tactile sidecar does not yet exist, the WebUI looks for the latest historical source matching:"""
          text = text.replace(old_annotation, new_annotation)
          migration = """## One-command migration\n\nTo make this repository self-contained from the dissertation/LF3R project, run:\n\n```bash\nbash tools/migrate_from_lf3r.sh /mnt/hdd/pyr/LF3R\n```\n\nThe script copies the exported fail-recovery dataset into the flat layout, rewrites manifest paths that still contain `/v1/`, migrates annotation records/events and USB interval seeds, and copies the tactile encoder checkpoints plus the two external tactile repositories when present. It intentionally does not copy virtual environments, raw recorder SQLite data, or historical generated SHARPA runs.\n\n"""
          if "## One-command migration" not in text:
              text = text.replace("## Run the WebUI\n", migration + "## Run the WebUI\n")
          p.write_text(text, encoding="utf-8")
          PY
      - name: Validate
        shell: bash
        run: |
          python -m compileall -q webui tools/sharpa_tactile tools/export_failrecovery_media.py tools/plot_failrecovery_tactile.py
          node --check webui/static/shell.js
          node --check webui/static/tactile/app.js
          python -m unittest discover -s webui/tests -v
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md webui tools
          if ! git diff --cached --quiet; then
            git commit -m "Flatten standalone tactile data layout"
            git push origin HEAD:refactor/flatten-layout
          fi
